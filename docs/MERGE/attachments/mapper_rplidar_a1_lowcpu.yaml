# Low-CPU variant of mapper_rplidar_a1.yaml — EXPERIMENTAL, NOT wired into
# navctl.sh yet (MAPPER= line untouched). Rationale + rollback: plans/
# 2026-11-20-jetson-cpu-budget.md. All diffs from the responsive profile are
# marked LOWCPU. Target: cut async_slam_toolbox_node cost 2-4x on the Orin
# Nano at walking speeds; re-measure with tools/cpu_recon.sh.
slam_toolbox:
  ros__parameters:

    # Plugin params (unchanged)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters (unchanged frames/topics — webctl nav contract)
    odom_frame:  odom_combined
    map_frame:   map
    base_frame:  base_footprint
    scan_topic:  /scan_filtered
    mode:        mapping

    # --- RPLidar A1M8: max 12m, 10Hz ---
    max_laser_range: 5.0           # LOWCPU: 10.0->5.0 (room-scale demo cage;
                                   # cuts ray-march + correlation extent)
    minimum_time_interval: 0.2     # LOWCPU: 0.0->0.2 back-pressure (async
                                   # node drops stale scans itself when busy)

    # Map
    resolution: 0.05               # keep: hub map import + nav rely on it
    map_update_interval: 5.0       # LOWCPU: 1.0->5.0 (rasterize 5x less often;
                                   # live-map web UI refresh will look staler)

    # TF
    transform_publish_period: 0.05 # LOWCPU: 0.02->0.05 (map->odom TF 50Hz->20Hz;
                                   # filter/EKF/AMCL all happy at 20Hz)
    transform_timeout: 0.2
    tf_buffer_duration: 30.0       # LOWCPU: 300->30 (memory + lookup cost)

    debug_logging: false
    throttle_scans: 3              # LOWCPU: 1->3 (match 3.3Hz not 10Hz; at
                                   # <0.6 m/s odometry still bridges gaps)
    stack_size_to_use: 40000000    # keep (Ceres thread stack, not CPU-bound)
    enable_interactive_mode: false # LOWCPU: true->false (pose-graph editing
                                   # never used by webctl; skips bookkeeping)

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 5            # LOWCPU: 10->5
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 3.0  # LOWCPU: 5.0->3.0 (smaller candidate set)
    do_loop_closing: true          # keep ON (demo correctness); if recon says
                                   # still hot, this is the NEXT knob to flip
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation — LOWCPU: resolution 0.01->0.02 (8x fewer search cells;
    # dimension already reduced to 0.3 by vendor tuning, keep)
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.1

    # Loop closure — LOWCPU: coarse grid 0.05->0.10 (4x fewer loop cells)
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.10
    loop_search_space_smear_deviation: 0.03

    # Scan matcher (unchanged)
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
